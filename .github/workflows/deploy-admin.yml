# ============================================================
# admin 管理后台静态部署（P2-15 · **GitHub Pages**，2026-10-16）
#
# ## 目标
# `admin/`（Vue3 + Vite 的 curation 管理后台）此前**只有本地 `vite build`**，无任何 CI 静态托管
# ⇒ 改完 curation 要人工在本地起 dev server 才能写库。本工作流把「build + 发布」自动化：
# push 到 `admin/**` 时自动构建并发布到 **GitHub Pages**。
#
# ## 为什么从 Netlify 改为 GitHub Pages（★ 2026-10-16 改定）
# 原方案（A · Netlify）需用户侧提供 `NETLIFY_AUTH_TOKEN` + `NETLIFY_SITE_ID`；**用户实际找不到这两个值**
# （新版 Netlify UI 入口变动 + 可能无可用账号）⇒ 该方案卡死。改判事实后选定本方案：
#   · 本仓库 **public**（API 实测 `"private": false`）⇒ **GitHub Pages 免费**；
#   · Pages 用内置 **`GITHUB_TOKEN`** ⇒ **零第三方账号、零新增 secret**（仅复用已配好的 `SUPABASE_ANON_KEY`）。
#
# ## admin 改为**经中转读取**（★ 2026-10-16，方案 ③）
#   实测本机/国内网络**直连 `*.supabase.co` 被 TLS RST 阻断**（沙箱内、沙箱外均复现）⇒ admin 直连读不出数据。
#   改为把 `VITE_SUPABASE_URL` 指到中转的 `/sb`（`${BASE}/rest/v1/*` ≈ 中转 `/sb/rest/v1/*`）。
#   配套改动（都在本次一起）：
#     · admin `restAll` 分页由 **`Range` 头** 改 **`limit`/`offset` 查询参数** —— 实测中转**不转发 `Range`**；
#     · `worker.mjs` 的 `EF_ALLOW` 放行 `admin-write`（写路径）；
#     · `worker.mjs` EF 分支**转发 `x-admin-token`**（否则写必 401）；
#     · `worker.mjs` CORS `Access-Control-Allow-Headers` 加 `X-Admin-Token`（否则浏览器预检被拒）。
#     注：中转的 REST/EF 分支会用**它自己的** anon key（`Object.assign(headers, sbHeaders)`），
#        故经中转读取**不依赖** admin 的 anon key；`SUPABASE_ANON_KEY` 仅作保留/直连备用。
#   ⚠️ 中转对 REST GET 有 120s 短缓存（键含 `url.search`）⇒ 分页各页各自入缓存，读全量会被缓存放大到 120s。
# ⚠️ 中转承载：admin 流量将计入 Deno 免费额度；`[0]` 挂则 admin 挂（单点，见 admin/README）。
#
# ## 前置（一次性，由用户侧完成）
#   1. 仓库 **Settings → Pages → Source = "GitHub Actions"**（未启用时首次部署会失败并明确报错）。
#      （工作流已带 `enablement: true`，能自动启用就用自动的；失败则按上句手动开。）
#   2. `SUPABASE_ANON_KEY` secret —— **已配置**（2026-10-16，公开安全、受 RLS 保护）。
#   3. `ADMIN_TOKEN` secret —— **可选**：写入口 EF 令牌。🔴 配它 = 把写令牌**内联进公开 bundle**
#      ⇒ 站点公开即等于公开写令牌；**不配则站点为只读**（写操作报缺令牌，不泄露写权限）。
#
# ## 构建期注入（Vite `import.meta.env`）
#   VITE_BASE = `/dota2-esports/` —— GitHub Pages **项目页**子路径（`admin/vite.config.js` 的 `base`；
#     不设则 index.html 里的 `/assets/*` 会 404）。
#
# ## 产物 URL
#   `https://re-toke.github.io/dota2-esports/`（路由为**哈希模式** `#/events`，纯静态零 404）
#
# ## 未做（诚实声明）
#   部署后的**冒烟**（打开站点 → 三列表加载 → （配令牌则）编辑保存 → 数据更新）需在**能直连
#   `*.supabase.co` 的网络**下由用户侧跑一遍。
# ============================================================
name: Deploy Admin

on:
  push:
    branches: [master]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

# Pages 发布所需最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支只保留最新一次发布（避免旧构建覆盖新站）
concurrency:
  group: deploy-admin-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      # 前置校验：缺 SUPABASE_ANON_KEY 则**尽早失败并给出可执行提示**
      - name: Check required secret
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 SUPABASE_ANON_KEY（仓库 Settings → Secrets and variables → Actions）—— 见工作流头注「前置」"
            exit 1
          fi

      - name: Install admin deps
        working-directory: admin
        run: npm ci

      - name: Build admin
        working-directory: admin
        env:
          VITE_BASE: /dota2-esports/
          VITE_SUPABASE_URL: https://hungry-pike-9907.re-toke.deno.net/sb   # ★ 方案③：经中转（国内可直连）
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}   # 空 ⇒ 只读站点（安全默认）
        run: |
          if [ -z "$VITE_ADMIN_TOKEN" ]; then
            echo "::warning::未配置 ADMIN_TOKEN ⇒ 本次发布为**只读**后台（写操作会报缺失令牌）。见头注「前置」第 3 条。"
          fi
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true    # 尝试自动启用 Pages；失败则手动 Settings → Pages → Source = GitHub Actions

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
