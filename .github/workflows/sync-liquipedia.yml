# ============================================================
# Liquipedia 缓存同步（**手动兜底**，定时已迁移到 Deno Deploy）
#
# ★ 2026-11-05：**定时调度已移除**。原因（实测）：
#   · GitHub 托管 runner 的 Azure 共享出口抓 LP 时 100% 返回 HTTP 429，
#     且**第一条请求就 429**（说明是来源 IP 被限流，不是请求频率问题）；
#     连续 4 次定时任务均 exit 2，单次空转 75 分钟。
#   · scheduled workflow 本身延迟严重：02:00Z 的 cron 实测 08:39Z 才启动（+6.6h）。
#   ⇒ 现由 Deno Deploy worker `infra/proxy/lp-sync.mjs` 承担：
#     每 15 分钟增量（RecentChanges 差集）、每小时淘汰赛结构，由 cron-job.org 触发。
#   ★ 2026-11-05 二次修订：**push 触发也已移除** ⇒ 本 workflow 现在是**纯手动兜底**。
#
# 前置配置（GitHub 仓库 → Settings → Secrets and variables → Actions）：
#   SUPABASE_URL          https://gkticzdaicpdtxheyxsd.supabase.co
#   SUPABASE_SERVICE_KEY  service_role key（Supabase Dashboard → Settings → API）
#
# 手动触发：Actions 页 → 选本 workflow → Run workflow
# ============================================================
name: Sync Liquipedia Cache

on:
  # ★ 2026-11-05：**push 触发也已移除** —— 本 workflow 现在是**纯手动**。
  #
  #   原 push.paths 覆盖「解析逻辑 + curation/slugmap」两类，动机是"这些文件变更后
  #   缓存必须重建"。但 GitHub 出口此刻抓 LP 必 429，push 触发的运行同样会失败并空转
  #   75 分钟 ⇒ 只产生噪音，不能重建任何东西。
  #
  #   取而代之：**curation/slugmap 变更后改走 Deno worker**
  #     ① `node infra/proxy/build-lp-sync.cjs`（把新 slug 烘进 worker）
  #     ② 重新粘贴 `infra/proxy/lp-sync.mjs` 到 Deno Playground
  #     ③ `curl ".../sync?token=<SYNC_TOKEN>&full=1"` 触发一次全量重建
  #   详见技术文档 §19。
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★ P3.0（2026-10-26）：bracket 结构 + Match 页 → lp:br:<bracketId>
      # ★ 2026-10-27：bracket 步骤前置 —— 旧缓存同步在 LP 失败率 >50% 时 exit 2，
      #   放在其后会被整步跳过（实测 2026-10-26 两次定时任务均未执行到本步）。
      - name: Sync brackets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync/sync-liquipedia-brackets.js

      - name: Run sync script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-liquipedia-cache.js
