# ============================================================
# Liquipedia 缓存定时同步（方案 2：绕开 Supabase 出口被 LP Cloudflare 拦）
# 每日 02:00 / 14:00 UTC（北京时间 10:00 / 22:00）各同步一次
#
# 前置配置（GitHub 仓库 → Settings → Secrets and variables → Actions）：
#   SUPABASE_URL          https://gkticzdaicpdtxheyxsd.supabase.co
#   SUPABASE_SERVICE_KEY  service_role key（Supabase Dashboard → Settings → API）
#
# 手动触发：Actions 页 → 选本 workflow → Run workflow
# ============================================================
name: Sync Liquipedia Cache

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:
  # ★ 2026-10-31：解析/合并逻辑变更后缓存必须重建，否则线上仍是旧 payload。
  #   push 触发只挂「解析逻辑」与「赛事清单（curation/slugmap）」两类，
  #   避免无关改动频繁打 LP（限速 1 req/2s）。
  push:
    branches: [master]
    paths:
      - 'scripts/sync/sync-liquipedia-brackets.js'
      - 'scripts/sync/sync-liquipedia-parse.js'
      - 'utils/liquipedia-parse.js'
      - '.github/workflows/sync-liquipedia.yml'
      # ★ 2026-11-03（EPL Masters III 首页卡缺失事故）：新增/改名赛事页只在 curation 与
      #   slugmap 里出现 ⇒ 仅这两个文件变更时也必须重建缓存，否则新赛事的 LP 页
      #   （lp:w:<slug>）**不在表里** → 客户端 EF 恒 miss → 首页「即将开始」无对局卡
      #   （实测：EPL/Masters/3 cache-miss，而 EPL/Masters/2 命中 53994B）。
      - 'utils/curation.js'
      - 'utils/liquipedia-slugmap.json'
      - 'utils/liquipedia-slugmap.js'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★ P3.0（2026-10-26）：bracket 结构 + Match 页 → lp:br:<bracketId>
      # ★ 2026-10-27：bracket 步骤前置 —— 旧缓存同步在 LP 失败率 >50% 时 exit 2，
      #   放在其后会被整步跳过（实测 2026-10-26 两次定时任务均未执行到本步）。
      - name: Sync brackets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync/sync-liquipedia-brackets.js

      - name: Run sync script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-liquipedia-cache.js
# re-index 2026-09-11
