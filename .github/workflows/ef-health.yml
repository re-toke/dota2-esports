# ============================================================
# EF 健康探测 + 告警（2026-09-12）
#
# ## 为什么需要
# 项目已决定「接受 EF 单点」（不再依赖云开发做兜底）。代价是：EF 挂了 = 小程序核心
# 功能不可用。所以**故障必须能被及时发现**，否则是「用户先发现」。
#
# ## 告警通道
# ① 主通道（零成本）：本 job 失败 → GitHub 自动发失败通知邮件给仓库 owner。
# ② ★ 2026-10-12（P1-13）二级通道：若配置了 `ALERT_WEBHOOK`（推送服务地址，
#    当前用 **Server酱**；见 scripts/ops/notify-alert.js，按 URL 自动判别平台），
#    失败时会额外推一条消息到微信。
#    动机：GH scheduled 实测会被丢弃/延迟 5~7h，且"job 失败邮件"极易被淹没。
#    ⚠️ 本项最初按飞书群机器人设计，但实测该飞书租户**看不到「自定义机器人」**（群机器人列表
#       只有官方应用）⇒ 改采 Server酱。**代码必须已推送**，否则 CI 会用旧的消息格式去发 Server酱。
#
# ## 探测口径（见 scripts/ops/probe-ef.js）
# 「EF 活着」= 有任何 HTTP 响应（含 400/401，只证明函数被调度起来）。
# 只有 超时 / 网络错 / 5xx 才算故障 → 退出码 1 → job 失败。
# 「慢」（超 8s）仅打 🐢 标记，**不触发告警**（避免噪音）。
#
# ## 频率
# 每 2 小时一次（GitHub cron 最小粒度；实际执行可能延迟几分钟，可接受）
# 也可在 Actions 页手动触发。
#
# ## 前置 Secrets
#   SUPABASE_URL / SUPABASE_SERVICE_KEY（已配置，用于把结果写入 ops:ef_health 留历史）
# ============================================================
name: EF Health Check

on:
  schedule:
    # 每 2 小时（UTC 偶数点；北京时间 +8 → 落在偶数点，避开整点拥堵）
    - cron: '15 */2 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe Edge Functions
        id: probe
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # 退出码 1 = 有 EF 故障 → job 失败 → GitHub 发失败通知
        run: node scripts/ops/probe-ef.js

      # ★ P1-13（2026-10-12）：**二级告警通道** —— 不再只依赖"GitHub job 失败邮件"
      #   （实测 scheduled 会被丢弃/延迟 5~7h，且邮件易被淹没）。
      #   未配 `ALERT_WEBHOOK` 时脚本自行跳过，不会制造第二个失败。
      - name: Notify on failure (webhook)
        if: steps.probe.outcome == 'failure'
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: node scripts/ops/notify-alert.js "EF 健康探测失败（见 EF Health Check 日志）"

      # 保持原语义：探测失败 ⇒ job 失败（GitHub 邮件仍是兜底通道）
      - name: Propagate failure
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error::EF 探测失败（已尝试 Webhook 告警）"
          exit 1
