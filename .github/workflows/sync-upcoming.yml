# ============================================================
# Sync Upcoming Schedule —— 「即将到来」赛程表定时刷新
#
# ★ 2026-09-21 新增（微信云开发脱离 · 路线 A 配套）
#   动机：`scripts/sync/fetch-liquipedia-upcoming.js` 此前**没有任何定时任务**跑它
#     —— 若不补这个 workflow，`upcoming_schedule` 表建好后**永远不会被刷新**，
#     客户端切到直读就会读到空表（这正是"接线≠生效"的典型陷阱）。
#
#   职责：抓 Liquipedia → ① 更新三件套快照（提交回仓库，供客户端本地兜底）
#                    ② 写 Supabase `upcoming_schedule`（服务端权威，客户端直读）
#
#   凭据：复用 repo **已有** 的 SUPABASE_URL / SUPABASE_SERVICE_KEY
#     （与 sync-liquipedia / discover-tournaments / ef-health 同一套，**无需新增 secret**）。
#
#   cron 与 `sync-liquipedia.yml`（0 2,14）**错开**，避免两个 LP 抓取任务撞同一窗口触发限速。
# ============================================================
name: Sync Upcoming Schedule

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:
  # ★ P1-A（2026-09-26）：**互补触发** —— 允许由 Supabase `pg_cron` 经 `repository_dispatch` 唤醒本工作流。
  #   为什么需要：GitHub 的 scheduled workflow **在高峰期会被丢弃/延迟**（实测本仓 ef-health 的
  #   "每 2 小时"实际跑成 5~7 小时一次；另有"近 11 次全失败、9/18 才由人工发现"的记录）。
  #   ⚠️ **这不是"双轨调度"** —— 两个触发源唤醒的是**同一个工作、同一套 Node 脚本**，
  #      因此**只互补、不独立**（真独立需把管道逻辑搬进 EF，而该路线项目已明确否决：
  #      `b5d228f Revert` + `bfe7c7f`「撤回不必要的 LP 迁移」）。
  #      它解决的是"**同一个任务被漏触发**"，不解决"GitHub 整体不可用"。
  repository_dispatch:
    types: [sync-upcoming-backup]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★★ 2026-09-28（A′ 配套）：**把两个「补接线」刷新步前置到 LP 抓取之前**。
      #   原顺序把它们排在 LP 步之后 ⇒ 2026-09-28 那次 LP 被限流失败时，这两步被**连带 skipped**，
      #   已能刷新的产物一个都没落地（"补强"实际被 LP 的抖动绑架）。
      #   这两步分别只依赖 **OpenDota** / **Steam CDN**，与 LP 毫无依赖关系 ⇒ 没有理由排在 LP 后面。
      #
      # ★★ 2026-09-27（快照过期诊断/复核 · 缺口 A）：补齐**另两个** build-time 快照的定时刷新。
      #
      #   问题：有「鲜度要求」的自动产物共 3 个，此前**只有 upcoming** 接了 CI：
      #     · upcoming-local      → 已接（见下）
      #     · leagues-local       → **无接线** ⇒ 永远停在最后一次手工生成（实测 12.7 天）
      #     · team-logo-local     → **无接线** ⇒ 实测 26 天未更新（140KB，且在包内）
      #   两者脚本均**无需密钥、无副作用**（只 `fs.writeFileSync` 写各自产物）⇒ 与 upcoming 同形。
      #
      #   ⚠️ `continue-on-error: true` 是**刻意**的：
      #     这两个脚本依赖 OpenDota；若其抖动/失败，**不能**让整个 job 失败 ——
      #     否则会连带**阻断随后的 upcoming 快照回写**（把一个"补强"变成"新增单点故障"）。
      #     失败不会静默：① 该 step 在运行页显示为 failed；② 新鲜度守卫（check-snapshot-freshness）会报警。
      - name: Refresh leagues snapshot (补接线)
        continue-on-error: true
        run: node scripts/sync/fetch-leagues-snapshot.js

      - name: Refresh team-logo snapshot (补接线)
        continue-on-error: true
        run: node scripts/sync/fetch-team-logos.js

      - name: Run upcoming sync (snapshot + Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync/fetch-liquipedia-upcoming.js

      # ★ P0-B 下半 / P0-C（2026-09-26）：**管道指标 + 调度心跳**
      #   把「快照新鲜度 / 条目数 / 本次运行时间」写进 curation_meta（key=diag_report）。
      #   ① 客户端「我的」页读它 ⇒ 用户/开发者都能看到"数据多久没更新"（消费方来源不同，非同一处自证）
      #   ② 该行本身就是**心跳**：定时任务若停摆，时间戳就不再前进
      #   ⚠️ 必须用 SUPABASE_SERVICE_KEY（curation_meta 仅 anon 只读 ⇒ 客户端写不了）；
      #      且**不可**改用 EF admin-write 的 updateMeta（它把 key 硬编码为 ti_contestant_ids，会写坏数据）。
      - name: Report pipeline metrics + heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/ops/diag-report.js --apply

      # ★★ 2026-09-28（A′ 配套）：加 `if: always()` —— LP 步失败时**也要**把已刷新的**其它**产物提交回仓库。
      #   原行为：LP 一红 ⇒ 本步 skipped ⇒ 上面两步已刷新的 leagues/team-logo 全部丢弃（补强变摆设）。
      #   双重守卫：① `steps.checkout.outcome == 'success'`（否则工作区为空，`git add` 会二次报错、掩盖真因）；
      #            ② 保留原有「暂存区无差异则跳过」兜底 ⇒ 空跑不会产生空提交。
      - name: Commit refreshed snapshot artifacts
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ★ 2026-09-27：回写范围扩到**全部有鲜度要求的产物**（此前只有 upcoming ⇒ leagues 停更 12.7 天）
          git add utils/upcoming-local.json utils/upcoming-local-data.js \
                  utils/leagues-local.json  utils/leagues-local-data.js \
                  utils/team-logo-map.json  utils/team-logo-local-data.js
          if git diff --quiet --cached; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore(snapshot): 定时刷新快照 upcoming/leagues/team-logo（CI，$(date -u +%Y-%m-%dT%H:%MZ)）"
            git push
          fi
