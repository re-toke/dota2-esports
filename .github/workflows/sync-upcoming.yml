# ============================================================
# Sync Upcoming Schedule —— 「即将到来」赛程表定时刷新
#
# ★ 2026-09-21 新增（微信云开发脱离 · 路线 A 配套）
#   动机：`scripts/sync/fetch-liquipedia-upcoming.js` 此前**没有任何定时任务**跑它
#     —— 若不补这个 workflow，`upcoming_schedule` 表建好后**永远不会被刷新**，
#     客户端切到直读就会读到空表（这正是"接线≠生效"的典型陷阱）。
#
#   职责：抓 Liquipedia → ① 更新三件套快照（提交回仓库，供客户端本地兜底）
#                    ② 写 Supabase `upcoming_schedule`（服务端权威，客户端直读）
#
#   凭据：复用 repo **已有** 的 SUPABASE_URL / SUPABASE_SERVICE_KEY
#     （与 sync-liquipedia / discover-tournaments / ef-health 同一套，**无需新增 secret**）。
#
#   cron 与 `sync-liquipedia.yml`（0 2,14）**错开**，避免两个 LP 抓取任务撞同一窗口触发限速。
# ============================================================
name: Sync Upcoming Schedule

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:
  # ★ P1-A（2026-09-26）：**互补触发** —— 允许由 Supabase `pg_cron` 经 `repository_dispatch` 唤醒本工作流。
  #   为什么需要：GitHub 的 scheduled workflow **在高峰期会被丢弃/延迟**（实测本仓 ef-health 的
  #   "每 2 小时"实际跑成 5~7 小时一次；另有"近 11 次全失败、9/18 才由人工发现"的记录）。
  #   ⚠️ **这不是"双轨调度"** —— 两个触发源唤醒的是**同一个工作、同一套 Node 脚本**，
  #      因此**只互补、不独立**（真独立需把管道逻辑搬进 EF，而该路线项目已明确否决：
  #      `b5d228f Revert` + `bfe7c7f`「撤回不必要的 LP 迁移」）。
  #      它解决的是"**同一个任务被漏触发**"，不解决"GitHub 整体不可用"。
  repository_dispatch:
    types: [sync-upcoming-backup]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run upcoming sync (snapshot + Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync/fetch-liquipedia-upcoming.js

      # ★ P0-B 下半 / P0-C（2026-09-26）：**管道指标 + 调度心跳**
      #   把「快照新鲜度 / 条目数 / 本次运行时间」写进 curation_meta（key=diag_report）。
      #   ① 客户端「我的」页读它 ⇒ 用户/开发者都能看到"数据多久没更新"（消费方来源不同，非同一处自证）
      #   ② 该行本身就是**心跳**：定时任务若停摆，时间戳就不再前进
      #   ⚠️ 必须用 SUPABASE_SERVICE_KEY（curation_meta 仅 anon 只读 ⇒ 客户端写不了）；
      #      且**不可**改用 EF admin-write 的 updateMeta（它把 key 硬编码为 ti_contestant_ids，会写坏数据）。
      - name: Report pipeline metrics + heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/ops/diag-report.js --apply

      - name: Commit refreshed snapshot artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add utils/upcoming-local.json utils/upcoming-local-data.js
          if git diff --quiet --cached; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore(snapshot): 定时刷新 upcoming-local（CI，$(date -u +%Y-%m-%dT%H:%MZ)）"
            git push
          fi
