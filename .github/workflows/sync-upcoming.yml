# ============================================================
# Sync Upcoming Schedule —— 「即将到来」赛程表定时刷新
#
# ★ 2026-09-21 新增（微信云开发脱离 · 路线 A 配套）
#   动机：`scripts/sync/fetch-liquipedia-upcoming.js` 此前**没有任何定时任务**跑它
#     —— 若不补这个 workflow，`upcoming_schedule` 表建好后**永远不会被刷新**，
#     客户端切到直读就会读到空表（这正是"接线≠生效"的典型陷阱）。
#
#   职责：抓 Liquipedia → ① 更新三件套快照（提交回仓库，供客户端本地兜底）
#                    ② 写 Supabase `upcoming_schedule`（服务端权威，客户端直读）
#
#   凭据：复用 repo **已有** 的 SUPABASE_URL / SUPABASE_SERVICE_KEY
#     （与 sync-liquipedia / discover-tournaments / ef-health 同一套，**无需新增 secret**）。
#
#   cron 与 `sync-liquipedia.yml`（0 2,14）**错开**，避免两个 LP 抓取任务撞同一窗口触发限速。
# ============================================================
name: Sync Upcoming Schedule

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run upcoming sync (snapshot + Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync/fetch-liquipedia-upcoming.js

      - name: Commit refreshed snapshot artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add utils/upcoming-local.json utils/upcoming-local-data.js cloudfunctions/aggregation/upcoming-local.json
          if git diff --quiet --cached; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore(snapshot): 定时刷新 upcoming-local（CI，$(date -u +%Y-%m-%dT%H:%MZ)）"
            git push
          fi
